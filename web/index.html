<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Cor da barra do navegador: uma por modo, escolhida pelo próprio navegador. O
     Safari nem sempre redesenha a barra quando um script troca essa cor ao vivo. -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#4a78e8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1838">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* Ao trocar o modo claro/escuro com a página aberta, o Safari às vezes mantém o fundo
   e o vidro (backdrop-filter) do modo anterior. A classe "repintando" desliga o
   desfoque e mexe no fundo por um quadro, o que obriga o redesenho. */
(() => {
  const esquemaEscuro = window.matchMedia("(prefers-color-scheme: dark)");
  const raiz = document.documentElement;
  function repintar() {
    raiz.classList.add("repintando");
    requestAnimationFrame(() => requestAnimationFrame(() => raiz.classList.remove("repintando")));
  }
  if (typeof esquemaEscuro.addEventListener === "function") esquemaEscuro.addEventListener("change", repintar);
  else if (typeof esquemaEscuro.addListener === "function") esquemaEscuro.addListener(repintar);
})();
</script>
<title>abafigurinhas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
/* ── Fundo: só CSS, proporcional à tela ─────────────────────────────────────
   Camada fixa de 100lvh (a viewport grande): não muda de tamanho quando a
   barra do navegador aparece ou some. As manchas são gradientes radiais em
   vmax, então mantêm o formato em qualquer proporção; as posições em % se
   espalham pela tela. Uma máscara vertical deixa o topo e a base na cor
   sólida das barras (--page-edge). */
:root{
  --page-edge:#4a78e8;
  --base:linear-gradient(180deg,#4a78e8 0%,#4a78e8 2%,#507ee9 6%,#628ced 10%,#7aa0f2 14%,#97b6f6 18%,#b5ccfa 22%,#cfdffd 26%,#e2ecff 30%,#e9f1ff 34%,#eef6ff 50%,#eaf3fb 66%,#e3eefb 70%,#d0e0fa 74%,#b5cdf8 78%,#97b7f5 82%,#7aa1f1 86%,#628ced 90%,#507ee9 94%,#4a78e8 98%,#4a78e8 100%);
  --campos:
    radial-gradient(44vmax 26vmax at 10% 36%, rgb(127 184 255 / 0.72), transparent 70%),
    radial-gradient(40vmax 28vmax at 90% 40%, rgb(111 224 240 / 0.66), transparent 70%),
    radial-gradient(48vmax 20vmax at 32% 58%, rgb(154 168 255 / 0.6), transparent 70%),
    radial-gradient(34vmax 24vmax at 76% 66%, rgb(142 240 210 / 0.55), transparent 70%),
    radial-gradient(36vmax 22vmax at 18% 72%, rgb(185 166 255 / 0.5), transparent 70%),
    radial-gradient(24vmax 30vmax at 58% 42%, rgb(168 208 255 / 0.55), transparent 70%),
    radial-gradient(30vmax 18vmax at 92% 80%, rgb(122 208 245 / 0.56), transparent 70%);
  --text:#1c1c1e; --bar-text:#0a0b0d; --bar-sub:rgba(0,0,0,.6);
  --vidro-tint:rgba(238,240,245,0.3);
  --frost:blur(5px) saturate(1.15);
  --glass-float:0 10px 28px rgba(30,20,90,.16), 0 2px 6px rgba(30,20,90,.08);
  --glass-ease:cubic-bezier(.34,1.36,.42,1);
  --focus:rgba(28,28,30,.5);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page-edge:#0d1838;
  --base:linear-gradient(180deg,#0d1838 0%,#0d1838 2%,#0d1939 6%,#0e1b3d 10%,#0f1e43 14%,#10214a 18%,#112450 22%,#122756 26%,#13295a 30%,#132a5c 34%,#0f2f4f 50%,#161f52 66%,#161f51 70%,#151e4e 74%,#131d4a 78%,#111c45 82%,#101a40 86%,#0e193c 90%,#0d1839 94%,#0d1838 98%,#0d1838 100%);
  --campos:
    radial-gradient(44vmax 26vmax at 10% 36%, rgb(47 111 224 / 0.44), transparent 70%),
    radial-gradient(40vmax 28vmax at 90% 40%, rgb(31 168 200 / 0.42), transparent 70%),
    radial-gradient(48vmax 20vmax at 32% 58%, rgb(75 80 216 / 0.36), transparent 70%),
    radial-gradient(34vmax 24vmax at 76% 66%, rgb(31 184 154 / 0.28), transparent 70%),
    radial-gradient(36vmax 22vmax at 18% 72%, rgb(106 79 216 / 0.3), transparent 70%),
    radial-gradient(24vmax 30vmax at 58% 42%, rgb(42 138 208 / 0.32), transparent 70%),
    radial-gradient(30vmax 18vmax at 92% 80%, rgb(60 124 224 / 0.34), transparent 70%);
  --text:#f5f5f7; --bar-text:#fff; --bar-sub:rgba(255,255,255,.6);
  --vidro-tint:rgba(18,18,20,0.3);
  --focus:rgba(245,245,247,.62);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page-edge:#0d1838;
  --base:linear-gradient(180deg,#0d1838 0%,#0d1838 2%,#0d1939 6%,#0e1b3d 10%,#0f1e43 14%,#10214a 18%,#112450 22%,#122756 26%,#13295a 30%,#132a5c 34%,#0f2f4f 50%,#161f52 66%,#161f51 70%,#151e4e 74%,#131d4a 78%,#111c45 82%,#101a40 86%,#0e193c 90%,#0d1839 94%,#0d1838 98%,#0d1838 100%);
  --campos:
    radial-gradient(44vmax 26vmax at 10% 36%, rgb(47 111 224 / 0.44), transparent 70%),
    radial-gradient(40vmax 28vmax at 90% 40%, rgb(31 168 200 / 0.42), transparent 70%),
    radial-gradient(48vmax 20vmax at 32% 58%, rgb(75 80 216 / 0.36), transparent 70%),
    radial-gradient(34vmax 24vmax at 76% 66%, rgb(31 184 154 / 0.28), transparent 70%),
    radial-gradient(36vmax 22vmax at 18% 72%, rgb(106 79 216 / 0.3), transparent 70%),
    radial-gradient(24vmax 30vmax at 58% 42%, rgb(42 138 208 / 0.32), transparent 70%),
    radial-gradient(30vmax 18vmax at 92% 80%, rgb(60 124 224 / 0.34), transparent 70%);
  --text:#f5f5f7; --bar-text:#fff; --bar-sub:rgba(255,255,255,.6);
  --vidro-tint:rgba(18,18,20,0.3);
  --focus:rgba(245,245,247,.62);
  color-scheme:dark;
}
html{background-color:var(--page-edge);isolation:isolate}
html,body{touch-action:pan-x pan-y}
html::before,html::after{content:"";position:fixed;z-index:-1;left:var(--visual-viewport-offset-left,0px);right:auto;width:var(--viewport-width,100%);top:var(--visual-viewport-offset-top,0px);height:100vh;height:100lvh;pointer-events:none}
html::before{background:var(--base)}
/* Redesenho forçado na troca de modo (ver o script no <head>). */
html.repintando .frost{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
html.repintando::before,html.repintando::after{opacity:.995}
html::after{background:var(--campos);
  -webkit-mask-image:linear-gradient(180deg,transparent 0 14%,#000 30% 70%,transparent 86% 100%);
          mask-image:linear-gradient(180deg,transparent 0 14%,#000 30% 70%,transparent 86% 100%)}

/* ── Card: tudo medido numa unidade proporcional à tela ─────────────────────
   --u acompanha o menor lado da tela (vmin), com piso e teto. O card inteiro
   (larguras, fontes, raios, espaços) está em em, então escala junto.
   Centralizado na viewport pequena (100svh): a área sempre visível, que não
   muda enquanto a barra do navegador anima. */
:root{--u:clamp(15px, 1.1vmin + 9px, 24px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  color:var(--text);background-color:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.frost{background:var(--vidro-tint);-webkit-backdrop-filter:var(--frost);backdrop-filter:var(--frost)}

.card{font-size:var(--u);width:min(38.75em,100%);border-radius:1.875em;padding:2.125em 1.375em 1.625em;box-shadow:var(--glass-float);
  display:grid;gap:1.375em;justify-items:center}
.card h1{margin:0;font-family:inherit;font-size:1.75em;font-weight:700;letter-spacing:-.022em;color:var(--bar-text);white-space:nowrap}
.pill-bar{position:relative;width:100%;height:3.25em;border-radius:1.625em}
.page-search{position:absolute;inset:0 3.06em 0 0;display:flex;align-items:center;gap:.125em;padding:0 0 0 1em;color:var(--bar-text)}
.page-search input{flex:1;min-width:0;height:2.5em;border:0;outline:0;background:transparent;padding:0;
  color:inherit;font:inherit;font-size:max(16px,1.0625em);letter-spacing:-.012em;caret-color:var(--bar-text);-webkit-appearance:none;appearance:none}
.page-search input::placeholder{color:var(--bar-sub);opacity:1}
.ps-sep[hidden]{display:none}
.ps-sep{flex:0 0 auto;width:1px;height:1.25em;margin:0 .19em;background:currentColor;opacity:.16}
.status{width:2.125em;height:2.125em;flex:0 0 auto;display:grid;place-items:center;color:var(--bar-sub);border:0;background:none;padding:0;border-radius:1.06em}
.status svg{width:1.19em;height:1.19em}
.status[hidden]{display:none}
.spin{animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
/* Botões redondos de vidro dentro da barra do arquivo: converter (seta, à direita) e anexar
   (clipe, ao lado dela). A seta também serve de "enviar" na barra do nome do pacote. */
.acao,.anexar{position:absolute;top:.5625em;width:2.125em;height:2.125em;border-radius:1.06em;border:0;padding:0;
  display:grid;place-items:center;color:var(--bar-text);box-shadow:var(--glass-float)}
.acao{right:.5625em}
.anexar{right:3.0625em}
.acao svg,.anexar svg{width:.94em;height:.94em}
.acao:disabled{cursor:default;opacity:.55}
.pill-bar.com-anexar .page-search{right:5.56em}

.btn{display:inline-flex;align-items:center;gap:.5em;padding:.75em 1.375em;min-height:max(44px,2.75em);border-radius:999px;border:0;
  font-size:.97em;font-weight:600;letter-spacing:-.006em;color:var(--bar-text);box-shadow:var(--glass-float);
  transition:opacity .2s ease, transform .2s var(--glass-ease)}
.btn:active{transform:scale(.975)}
.btn svg{width:1.03em;height:1.03em}
.motivo{margin:-.5em 0 0;font-size:.85em;color:var(--bar-sub);text-align:center}
.motivo[hidden]{display:none}

/* ── Prévia, dica e motivo ──────────────────────────────────────────────── */
.dica{margin:-.5em 0 0;font-size:.85em;line-height:1.4;color:var(--bar-sub);text-align:center}
.dica[hidden]{display:none}
/* Prévia: a figurinha fica sobre um cartão de vidro, só um pouco maior que ela. O lado é limitado
   por --hmax (definido no bloco compacto), que desconta o resto do card para tudo caber sem rolar. */
.moldura{--pad:.5em;display:none;justify-self:center;padding:var(--pad);border-radius:1.1em;box-shadow:var(--glass-float);
  width:min(100%,calc(var(--hmax) + 2 * var(--pad)))}
.moldura.on{display:block}
.previa{display:block;width:100%;height:auto}

/* ── Específico do abafigurinhas ────────────────────────────────────────────────── */
.pill-bar.sem-botao .page-search{inset:0;padding-right:1em}
.page-search input[readonly]{cursor:pointer;text-overflow:ellipsis}
.page-search select{flex:1;min-width:0;height:2.5em;border:0;outline:0;background:transparent;padding:0;color:inherit;font:inherit;
  font-size:max(16px,1.0625em);letter-spacing:-.012em;-webkit-appearance:none;appearance:none;text-overflow:ellipsis;cursor:pointer}
.page-search select option{color:#1c1c1e}
.caret{flex:0 0 auto;width:1em;height:1em;opacity:.6;pointer-events:none}
.pill-bar[hidden],.btn[hidden]{display:none}
.previa-video{display:none}
.moldura.video .previa{display:none}.moldura.video .previa-video{display:block}

/* ── Modo compacto do Mini App (meia altura) ────────────────────────────────
   O Telegram mantém --tg-viewport-stable-height na raiz; fora dele vale 100svh.
   Tudo acompanha essa altura: o cartão é mais justo, fica no topo e a prévia
   encolhe para o resto caber sem rolar (ou rolando pouco). */
:root{--vh:var(--tg-viewport-stable-height,100svh)}
body{min-height:var(--vh);place-items:center;padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom))}
.card{padding:1.25em 1.1em 1.1em;gap:.8em;border-radius:1.6em}
.card h1{font-size:1.4em}
.pill-bar{height:3em;border-radius:1.5em}
.page-search{padding-left:.9em}
.acao{top:.4375em;right:.4375em}.anexar{top:.4375em;right:2.9375em}
.moldura{--hmax:max(7em,calc(var(--vh) - 19.8em))}
.btn{width:100%;justify-content:center;height:calc(3 * var(--u));min-height:0;padding:0 1.2em;border-radius:calc(1.5 * var(--u))}

/* ── Contorno da figurinha ──────────────────────────────────────────────── */
.forma{display:grid;grid-template-columns:repeat(3,1fr);gap:.2em;width:100%;height:3em;padding:.25em;border-radius:1.5em}
.forma button{display:flex;align-items:center;justify-content:center;gap:.4em;min-width:0;height:100%;padding:0 .2em;border:0;border-radius:calc(1.25 * var(--u));
  background:transparent;color:var(--bar-sub);font-size:.8em;font-weight:500;letter-spacing:-.01em;transition:background .2s ease,color .2s ease}
.forma button svg{width:1.3em;height:1.3em;flex:0 0 auto}
.forma button span{white-space:nowrap}
/* o destaque usa o mesmo vidro e a mesma sombra dos botões redondos */
.forma button[aria-checked="true"]{background:var(--vidro-tint);-webkit-backdrop-filter:var(--frost);backdrop-filter:var(--frost);color:var(--bar-text);font-weight:600;box-shadow:var(--glass-float)}
/* a prévia mostra o contorno de verdade: sem cantos arredondados fixos */
/* O iOS não desenha a transparência do WebM na prévia (cantos pretos): recorta no contorno. */
.moldura[data-forma="rounded"] .previa{border-radius:14%}
.moldura[data-forma="squircle"] .previa{clip-path:url(#clip-squircle)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><clipPath id="clip-squircle" clipPathUnits="objectBoundingBox"><path id="clip-squircle-d" d=""/></clipPath></svg>
<main class="card frost">
  <h1>abafigurinhas</h1>

  <div class="pill-bar com-anexar frost" id="arquivo-bar">
    <form class="page-search" role="search" aria-label="Converter arquivo" id="form">
      <input id="nome-arquivo" type="text" readonly placeholder="Imagem ou vídeo" aria-label="Arquivo escolhido"
             autocomplete="off" spellcheck="false">
      <span class="ps-sep" id="sep" aria-hidden="true" hidden></span>
      <span class="status" id="st-carregando" role="status" aria-label="Convertendo" hidden>
        <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9" /></svg>
      </span>
      <span class="status" id="st-pronto" role="status" aria-label="Pronto" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.4 4.4L19 7.3"/></svg>
      </span>
      <button class="status" type="button" id="st-erro" aria-label="Falhou. Ver motivo" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.4v.1"/></svg>
      </button>
    </form>
    <button class="anexar frost" type="button" id="anexar" aria-label="Escolher arquivo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 11.5-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.9-8.9a3.7 3.7 0 0 1 5.2 5.2l-8.9 8.9a1.8 1.8 0 0 1-2.6-2.6l8.2-8.2"/></svg>
    </button>
    <button class="acao frost" type="submit" form="form" id="converter" aria-label="Converter" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0-5 5m5-5 5 5"/></svg>
    </button>
  </div>
  <input type="file" id="arquivo" accept="image/*,video/*" hidden>

  <div class="forma frost" id="forma" role="radiogroup" aria-label="Contorno da figurinha">
    <button type="button" role="radio" aria-checked="true" data-forma="square">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16"/></svg><span>square</span></button>
    <button type="button" role="radio" aria-checked="false" data-forma="rounded">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="4"/></svg><span>rounded</span></button>
    <button type="button" role="radio" aria-checked="false" data-forma="squircle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3.5c6.6 0 8.5 1.9 8.5 8.5s-1.9 8.5-8.5 8.5-8.5-1.9-8.5-8.5S5.4 3.5 12 3.5Z"/></svg><span>squircle</span></button>
  </div>

  <p class="dica" id="dica" hidden></p>
  <p class="motivo" id="motivo" role="alert" hidden></p>

  <div class="moldura frost" id="moldura">
    <img class="previa" id="imagem" alt="Prévia da figurinha">
    <video class="previa previa-video" id="video" muted loop autoplay playsinline></video>
  </div>

  <div class="pill-bar sem-botao frost" id="destino-bar" hidden>
    <div class="page-search">
      <select id="destino" aria-label="Pacote de destino"></select>
      <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>
  </div>
  <div class="pill-bar com-anexar frost" id="campo-bar" hidden>
    <div class="page-search">
      <input id="campo" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="send" maxlength="200" placeholder="Nome do novo pacote" aria-label="Nome do novo pacote">
    </div>
    <button class="anexar frost" type="button" id="cancelar" aria-label="Voltar para a lista de pacotes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <button class="acao frost" type="button" id="enviar" aria-label="Criar pacote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0-5 5m5-5 5 5"/></svg>
    </button>
  </div>

  <button class="btn frost" type="button" id="abrir" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/></svg><span>Abrir pacote</span></button>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
