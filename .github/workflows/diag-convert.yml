name: Diagnóstico do /convert (tgcloud run)

# Executa a conversão de vídeo em voz NA PLATAFORMA (tgcloud run), sem publicar nada:
# mostra o tempo de cada etapa e onde ela falha. Rodar manualmente em Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar ffmpeg (só para gerar os vídeos de teste)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Sincronizar estado da nuvem
        run: npm run fetch
      - name: Converter na plataforma
        continue-on-error: true
        run: node scripts/diag-convert.mjs
      - name: Medir CPU por etapa e WebAssembly na plataforma
        run: node scripts/diag-cpu.mjs
